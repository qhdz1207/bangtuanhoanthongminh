<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bảng tuần hoàn các nguyên tố hoá học</title>
<style>
:root{--bg:#070b16;--card:#0d1426;--line:#1e2a44;--tx:#e8edf7;--mut:#8b97b3;--kl:#4aa8e8;--cd:#f7b731;--pk:#f0606f;--kh:#8cc63f;--acc:#5b4ff0;--bg2:#0a1020;--bg3:#0b1224;--link:#a9b4ff;--box:#0d1630;--panel:#17223f;--pline:#33466f;--mut2:#bcc8e2;--ov:rgba(2,5,12,.9);--bohr:#050a17}
:root[data-theme=light]{--bg:#f3f6fb;--card:#fff;--line:#d3dbe8;--tx:#0f172a;--mut:#5b6b85;--kl:#1d7fd1;--cd:#b87a00;--pk:#d6354a;--kh:#4a8f12;--bg2:#f6f9fd;--bg3:#e9eff8;--link:#4338ca;color-scheme:light;--box:#fff;--panel:#f1f5fb;--pline:#d3dbe8;--mut2:#4a5a75;--ov:rgba(15,23,42,.6);--bohr:#eaf0fa}
body{position:relative}#th{position:absolute;right:16px;top:14px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;padding:16px}
h1{text-align:center;color:#2fb7ac;font-size:clamp(20px,3vw,34px);margin:6px 0 14px;letter-spacing:.5px}
.bar{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center;margin-bottom:14px}
input{background:var(--card);border:1px solid var(--line);color:var(--tx);border-radius:10px;padding:10px 14px;width:min(360px,100%);font-size:15px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--tx);border-radius:999px;padding:8px 14px;cursor:pointer;font-size:14px;display:flex;gap:8px;align-items:center}
.chip i{width:12px;height:12px;border-radius:3px;display:inline-block}
.chip.on{outline:2px solid var(--acc)}
.chip.sp i{background:linear-gradient(135deg,#f7b731,#f0606f)}
#spinfo{display:none;max-width:1000px;margin:0 auto 14px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
#spinfo h3{margin:0 0 8px}
#spinfo .it{display:inline-flex;gap:8px;align-items:center;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:6px 10px;margin:3px;font-size:13px;cursor:pointer}
#spinfo .it b{color:var(--tx)}#spinfo .it span{font-family:monospace;color:var(--link)}
.el.spk::after{content:"";position:absolute;top:3px;right:3px;width:6px;height:6px;border-radius:50%;background:var(--tx);box-shadow:0 0 0 1px #0006}
.tempbar{max-width:1000px;margin:0 auto 14px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 16px;display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.tempbar label{font-weight:600;color:#f0606f;white-space:nowrap}
#T{flex:1;min-width:180px;width:auto;padding:0;accent-color:#4aa8e8}
#tv{text-align:center;min-width:110px;font-family:monospace}#tv b{font-size:18px;color:#7cc4ff;display:block}#tv span{font-size:12px;color:var(--mut)}
.lg{display:flex;gap:10px;font-size:12px;color:var(--mut);align-items:center}.lg i{display:inline-block;width:18px;height:6px;border-radius:3px;margin-right:4px;vertical-align:middle}
.tb{height:5px;border-radius:3px;position:relative;margin-top:3px;flex:none}
.tb i{position:absolute;top:-2px;width:2px;height:9px;background:#fff;box-shadow:0 0 0 1px #000a;transform:translateX(-1px);transition:left .15s}
.wrap{overflow-x:auto;padding-bottom:8px}
#grid{display:grid;grid-template-columns:34px repeat(18,minmax(52px,1fr));gap:3px;min-width:1030px;max-width:1500px;margin:auto}
.el{aspect-ratio:1/1.12;border-radius:9px;color:var(--c);border:1px solid color-mix(in srgb,var(--c) 70%,transparent);background:color-mix(in srgb,var(--c) 9%,transparent);padding:3px 4px;cursor:pointer;display:flex;flex-direction:column;justify-content:space-between;transition:transform .12s,opacity .2s,background .12s;position:relative}
.el:hover{background:color-mix(in srgb,var(--c) 22%,transparent)}
.el .ms{font-size:9px;color:var(--mut)}
.sym{color:var(--c)}
.el:hover{transform:scale(1.18);z-index:5;box-shadow:0 6px 20px #0008}
.el .n{font-size:10px;font-weight:700}
.el .top{display:flex;justify-content:space-between;align-items:center;gap:2px}
.st{font-size:8px;font-weight:700;text-align:center;line-height:10px;color:var(--mut)}.st.l{color:#3b82f6}.st.k{color:#a855f7}.st.u{color:#9ca3af}
.el .s{font-size:clamp(15px,1.7vw,24px);font-weight:700;text-align:center;line-height:1}
.el .m{font-size:9px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.el.dim{opacity:.12;pointer-events:none}
.kl{--c:var(--kl)}.cd{--c:var(--cd)}.pk{--c:var(--pk)}.kh{--c:var(--kh)}
.hdr{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;font-size:11px;color:var(--mut);line-height:1.25;padding-bottom:2px}
.hdr b{color:var(--tx);font-size:13px}
.per{display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--tx);font-size:14px}
.corner{font-size:10px;color:var(--mut);display:flex;align-items:flex-end;justify-content:center}
.lbl{display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--mut);text-align:center}
#modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:14px;z-index:20}
#modal.open{display:flex}
.box{background:var(--bg2);border:1px solid var(--line);border-radius:18px;width:min(900px,100%);max-height:94vh;overflow:auto}
.hd{display:flex;gap:16px;align-items:center;padding:20px;border-bottom:1px solid var(--line)}
.sym{width:92px;height:92px;border-radius:14px;border:1px solid var(--c);background:color-mix(in srgb,var(--c) 12%,transparent);display:flex;flex-direction:column;align-items:center;justify-content:center}
.sym b{font-size:38px}.sym small{font-size:13px}
.hd h2{margin:0;font-size:28px}.hd h2 span{color:var(--mut);font-size:18px;font-weight:400}
.cat{font-weight:600;margin-top:4px}.x{margin-left:auto;background:var(--bg3);border:0;color:var(--mut);width:40px;height:40px;border-radius:10px;font-size:20px;cursor:pointer}
.bd{display:grid;grid-template-columns:1fr 1.2fr;gap:20px;padding:20px}
@media(max-width:720px){.bd{grid-template-columns:1fr}}
.bohr{background:var(--bg3);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center}
.bohr h4{margin:4px 0 0;color:var(--mut);font-size:13px;letter-spacing:1px}
.bohr svg{width:100%;max-width:340px}
.cfg{font-family:monospace;color:var(--link);font-size:13px;margin-top:6px}
.props{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.p{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:12px}
.p span{display:block;font-size:12px;color:var(--mut);margin-bottom:4px}.p b{font-size:16px}
h3{font-size:14px;color:var(--mut);margin:0 0 10px}
.desc{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:14px;font-size:14px;line-height:1.5;margin-top:14px}
.ft{padding:14px 20px;border-top:1px solid var(--line);text-align:right}
.btn{background:var(--acc);color:#fff;border:0;border-radius:10px;padding:11px 18px;font-size:15px;font-weight:600;cursor:pointer}
#cmp{max-width:1000px;margin:18px auto 0;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:none}
#cmp table{width:100%;border-collapse:collapse;font-size:14px}
#cmp td,#cmp th{border-bottom:1px solid var(--line);padding:8px;text-align:left}
.note{text-align:center;color:var(--mut);font-size:12px;margin-top:12px}
@keyframes sp{to{transform:rotate(360deg)}}
.orb{transform-origin:170px 170px;animation:sp linear infinite}
/* Thẻ chi tiết: nền đặc, tương phản cao */
#modal{background:var(--ov);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.box{background:var(--box);border:1px solid var(--pline);box-shadow:0 24px 70px #000d}
.hd,.ft{border-color:var(--pline)}
.hd h2{color:var(--tx)}.hd h2 span{color:var(--mut2)}
.x{background:var(--panel);color:var(--tx)}
.bohr{background:var(--bohr);border-color:var(--pline)}
.bohr h4,h3{color:var(--mut2)}
.p,.desc{background:var(--panel);border-color:var(--pline)}
.p span{color:var(--mut2)}.p b{color:var(--tx)}
.desc{color:var(--tx)}
.sym{background:color-mix(in srgb,var(--c) 22%,var(--box))}
</style>
</head>

29:'Dẫn điện và dẫn nhiệt rất tốt; dùng làm dây điện, đồ đồng.',
47:'Kim loại quý, dẫn điện tốt nhất; dùng trang sức, điện tử, gương.',
79:'Kim loại quý, bền hoá học, dùng trang sức, điện tử và dự trữ giá trị.',
80:'Kim loại duy nhất lỏng ở điều kiện thường; rất độc.',
82:'Kim loại nặng, mềm; dùng ắc quy chì-axit, che chắn bức xạ; độc với con người.',
92:'Nguyên tố phóng xạ, nhiên liệu của lò phản ứng hạt nhân.'};

const CFG={24:'[Ar] 3d⁵ 4s¹',29:'[Ar] 3d¹⁰ 4s¹',41:'[Kr] 4d⁴ 5s¹',42:'[Kr] 4d⁵ 5s¹',44:'[Kr] 4d⁷ 5s¹',45:'[Kr] 4d⁸ 5s¹',46:'[Kr] 4d¹⁰',47:'[Kr] 4d¹⁰ 5s¹',57:'[Xe] 5d¹ 6s²',58:'[Xe] 4f¹ 5d¹ 6s²',64:'[Xe] 4f⁷ 5d¹ 6s²',78:'[Xe] 4f¹⁴ 5d⁹ 6s¹',79:'[Xe] 4f¹⁴ 5d¹⁰ 6s¹'};
const GAS=[1,2,7,8,9,10,17,18,36,54,86],LIQ=[35,80];
const stT=z=>GAS.includes(z)?'Khí':LIQ.includes(z)?'Lỏng':z>=104?'Chưa rõ':'Rắn';
const stC=z=>GAS.includes(z)?'k':LIQ.includes(z)?'l':z>=104?'u':'';
let curT=298;
function stAt(e,T=curT){if(!e.mp)return'Chưa rõ';const mp=+e.mp,bp=+e.bp;if(T<mp)return'Rắn';if(e.bp)return T>=bp?'Khí':'Lỏng';return'Chưa rõ'}
const stK=t=>t==='Khí'?'k':t==='Lỏng'?'l':t==='Rắn'?'':'u';
function barBG(e){if(!e.mp)return'#6b7280';const a=Math.min(100,+e.mp/60);if(!e.bp)return`linear-gradient(90deg,#64748b ${a}%,#6b7280 ${a}%)`;const b=Math.min(100,+e.bp/60);return`linear-gradient(90deg,#64748b ${a}%,#1d4ed8 ${a}% ${b}%,#7c3aed ${b}%)`}
const SUP='⁰¹²³⁴⁵⁶⁷⁸⁹';const sup=n=>String(n).split('').map(d=>SUP[d]).join('');
const EX={24:[2,8,13,1],29:[2,8,18,1],41:[2,8,18,12,1],42:[2,8,18,13,1],44:[2,8,18,15,1],45:[2,8,18,16,1],46:[2,8,18,18],47:[2,8,18,18,1],57:[2,8,18,18,9,2],58:[2,8,18,19,9,2],64:[2,8,18,25,9,2],78:[2,8,18,32,17,1],79:[2,8,18,32,18,1]};

const E=RAW.split('\n').map((r,i)=>{const f=r.split('|'),z=i+1;
  const c=NOBLE.includes(z)?'kh':NONMETAL.includes(z)?'pk':isTrans(z)?'cd':'kl';
  return{z,sym:f[0],name:f[1],mass:f[2],den:f[3],en:f[4],ox:f[5],mp:f[6],bp:f[7],yr:f[8],c}});

function pos(z){
  if(z===1)return[1,1];if(z===2)return[1,18];
  if(z<=4)return[2,z-2];if(z<=10)return[2,z+8];
  if(z<=12)return[3,z-10];if(z<=18)return[3,z];
  if(z<=36)return[4,z-18];if(z<=54)return[5,z-36];
  if(z<=56)return[6,z-54];if(z<=71)return[9,z-54];
  if(z<=86)return[6,z-68];if(z<=88)return[7,z-86];
  if(z<=103)return[10,z-86];return[7,z-100];
}
const grp=z=>{const [r,c]=pos(z);return r>=9?null:c};
const per=z=>{const [r]=pos(z);return r>=9?(r===9?6:7):r};

function shellsOf(z){
  if(EX[z])return EX[z];
  const order=[];for(let s=2;s<=15;s++)for(let l=Math.min(Math.floor((s-1)/1),3);l>=0;l--){const n=s-l;if(n>=l+1&&l<=3)order.push([n,l])}
  order.sort((a,b)=>(a[0]+a[1])-(b[0]+b[1])||a[0]-b[0]);
  const sh=[];let left=z,cfg=[];
  for(const [n,l] of order){if(left<=0)break;const k=Math.min(left,2*(2*l+1));left-=k;sh[n-1]=(sh[n-1]||0)+k;cfg.push([n,'spdf'[l],k])}
  shellsOf.cfg=cfg;return sh;
}
function config(z){
  shellsOf(z===1?1:z>0?(EX[z]?(shellsOf.cfg=null,z):z):z);
  const sh=EX[z]?null:null;
  if(CFG[z])return CFG[z]+' (đặc biệt)';
  const full=shellsOf.cfg;const noble=[[2,'He'],[10,'Ne'],[18,'Ar'],[36,'Kr'],[54,'Xe'],[86,'Rn']];
  let core=null;for(const [n,s] of noble)if(z>n+0&&z>n)core=[n,s];
  let acc=0,out=[],used=0;
  if(core){for(const t of full){if(used>=core[0])break;used+=t[2]}}
  const rest=[];let u=0;for(const t of full){if(u>=(core?core[0]:0))rest.push(t);u+=t[2]}
  rest.sort((a,b)=>a[0]-b[0]||'spdf'.indexOf(a[1])-'spdf'.indexOf(b[1]));
  return (core?'['+core[1]+'] ':'')+rest.map(t=>t[0]+t[1]+sup(t[2])).join(' ');
}

const g=document.getElementById('grid');
function cell(e,r,c){const d=document.createElement('div');d.className='el '+e.c;d.style.gridRow=r+1;d.style.gridColumn=c+1;d.dataset.z=e.z;
  d.innerHTML=`<div class="top"><span class="n">${e.z}</span><span class="ms">${(+e.mass).toFixed(1)}</span></div><span class="s">${e.sym}</span><span class="m">${VN[e.z-1]}</span><span class="st"></span><div class="tb" title="Nóng chảy: ${e.mp?e.mp+' K':'—'} | Sôi: ${e.bp?e.bp+' K':'—'}"><i></i></div>`;d.querySelector('.tb').style.background=barBG(e);
  d.onclick=()=>open(e.z);g.appendChild(d)}
function ph(r,c,t){const d=document.createElement('div');d.className='lbl';d.style.gridRow=r+1;d.style.gridColumn=c+1;d.textContent=t;g.appendChild(d)}
E.forEach(e=>{const[r,c]=pos(e.z);cell(e,r,c)});
ph(6,3,'57–71');ph(7,3,'89–103');ph(9,1,'Lanthanide');ph(10,1,'Actinide');
g.style.gridTemplateRows='auto repeat(7,auto) 14px repeat(2,auto)';
(function(){const k=document.createElement('div');k.className='corner';k.style.cssText='grid-row:1;grid-column:1';k.innerHTML='Chu kì';g.appendChild(k);
GL.forEach((l,i)=>{const h=document.createElement('div');h.className='hdr';h.style.cssText='grid-row:1;grid-column:'+(i+2);h.innerHTML='<b>'+(i+1)+'</b>'+l;g.appendChild(h)});
for(let p=1;p<=7;p++){const d=document.createElement('div');d.className='per';d.style.cssText='grid-row:'+(p+1)+';grid-column:1';d.textContent=p;g.appendChild(d)}})();

let cat=null;
document.querySelectorAll('.chip[data-c]').forEach(b=>b.onclick=()=>{cat=cat===b.dataset.c?null:b.dataset.c;document.querySelectorAll('.chip[data-c]').forEach(x=>x.classList.toggle('on',x.dataset.c===cat));filter()});
let sp=false;
document.getElementById('spbtn').onclick=function(){sp=!sp;this.classList.toggle('on',sp);filter()};
const q=document.getElementById('q');q.oninput=filter;
function filter(){
  const t=q.value.trim().toLowerCase();let m=null;
  if(m=t.match(/^([<>])\s*(\d+)$/)){}
  document.querySelectorAll('.el').forEach(d=>{const e=E[d.dataset.z-1];let ok=(!cat||e.c===cat)&&(!sp||!!EX[e.z]);
    if(ok&&t){if(m)ok=m[1]==='>'?e.z>+m[2]:e.z<+m[2];
      else{const u=nz(t);ok=nz(e.sym)===u||nz(e.name).includes(u)||nz(VN[e.z-1]).includes(u)||String(e.z)===t||nz(stAt(e))===u||nz(CAT[e.c]).includes(u)}}
    d.classList.toggle('dim',!ok);d.classList.toggle('spk',sp&&!!EX[e.z])});
  const bx=document.getElementById('spinfo');bx.style.display=sp?'block':'none';
  if(sp)bx.innerHTML='<h3>MỘT SỐ CẤU HÌNH ELECTRON ĐẶC BIỆT (bấm để xem chi tiết)</h3>'+Object.keys(CFG).filter(z=>!cat||E[z-1].c===cat).map(z=>`<div class="it" onclick="open(${z})"><b>${z} ${E[z-1].sym}</b><span>${CFG[z]}</span></div>`).join('')}

function bohr(z){
  const sh=shellsOf(z)&&(EX[z]||shellsOf(z)).filter(x=>x);
  let s=`<svg viewBox="0 0 340 340"><circle cx="170" cy="170" r="${z>20?10:14}" fill="#ef4444" stroke="#fca5a5"/>`;
  const step=Math.min(22,135/sh.length);
  sh.forEach((n,i)=>{const r=26+step*(i+1)*(sh.length>5?1:1.1);
    s+=`<circle cx="170" cy="170" r="${r}" fill="none" style="stroke:var(--line)" stroke-dasharray="3 4"/>`;
    s+=`<g class="orb" style="animation-duration:${6+i*4}s">`;
    for(let k=0;k<n;k++){const a=2*Math.PI*k/n;s+=`<circle cx="${170+r*Math.cos(a)}" cy="${170+r*Math.sin(a)}" r="3.6" fill="#38bdf8"/>`}
    s+='</g>'});
  return s+'</svg>'}

const fmt=(v,u='')=>v?v+u:'—';
const K=v=>v?`${v} K (${Math.round(v-273.15)}°C)`:'—';
const cmp=[];
function open(z){
  const e=E[z-1],[r,c]=pos(z),state=z===2?'Lỏng':'Rắn';
  const desc=DESC[z-1];
  document.getElementById('box').innerHTML=`
  <div class="hd"><div class="sym ${e.c}"><small>${z}</small><b>${e.sym}</b></div>
    <div><h2>${e.name} <span>(${VN[z-1]})</span></h2><div class="cat" style="color:${COL[e.c]}">${CAT[e.c]}</div>
    <div style="color:var(--mut);font-size:13px">Trạng thái ở ${curT} K: ${stAt(e)}</div></div>
    <button class="x" onclick="closeM()">✕</button></div>
  <div class="bd"><div class="bohr"><h4>MÔ HÌNH NGUYÊN TỬ BOHR</h4>${bohr(z)}<div class="cfg">${config(z)}</div></div>
  <div><h3>Tính chất Hoá-Lý</h3><div class="props">
    <div class="p"><span>Khối lượng nguyên tử</span><b>${e.mass} u</b></div>
    <div class="p"><span>Mật độ (g/cm³)</span><b>${fmt(e.den)}</b></div>
    <div class="p"><span>Độ âm điện (Pauling)</span><b>${fmt(e.en)}</b></div>
    <div class="p"><span>Trạng thái ôxi hóa</span><b>${fmt(e.ox)}</b></div>
    <div class="p"><span>Điểm nóng chảy</span><b>${K(e.mp)}</b></div>
    <div class="p"><span>Điểm sôi</span><b>${K(e.bp)}</b></div>
    <div class="p"><span>Chu kỳ / Nhóm</span><b>Chu kỳ ${per(z)}, ${grp(z)?'Nhóm '+grp(z)+' ('+GL[grp(z)-1]+')':(r===9?'Lanthanide':'Actinide')}</b></div>
    <div class="p"><span>Năm phát hiện</span><b>${e.yr==='0'?'Cổ đại':e.yr}</b></div>
    <div class="p"><span>Số hiệu nguyên tử (Z)</span><b>${z}</b></div>
    <div class="p"><span>Trạng thái (25°C, 1 atm)</span><b>${stT(z)}</b></div></div>
    <div class="desc"><h3 style="margin-bottom:6px">ỨNG DỤNG & ĐẶC ĐIỂM</h3>${desc}</div></div></div>
  <div class="ft"><button class="btn" onclick="addCmp(${z})">+ Thêm vào so sánh</button></div>`;
  document.getElementById('modal').classList.add('open')}
function closeM(){document.getElementById('modal').classList.remove('open')}
document.getElementById('modal').onclick=e=>{if(e.target.id==='modal')closeM()};
addEventListener('keydown',e=>{if(e.key==='Escape')closeM()});

function addCmp(z){if(!cmp.includes(z)){if(cmp.length>=4)cmp.shift();cmp.push(z)}renderCmp();closeM()}
function rmCmp(z){cmp.splice(cmp.indexOf(z),1);renderCmp()}
function renderCmp(){
  const el=document.getElementById('cmp');if(!cmp.length){el.style.display='none';return}
  const L=[E[0]].slice(0,0),es=cmp.map(z=>E[z-1]);
  const rows=[['Khối lượng (u)','mass'],['Mật độ (g/cm³)','den'],['Độ âm điện','en'],['Số ôxi hóa','ox'],['Nóng chảy (K)','mp'],['Sôi (K)','bp'],['Năm phát hiện','yr']];
  el.style.display='block';
  el.innerHTML=`<h3>SO SÁNH NGUYÊN TỐ</h3><table><tr><th></th>${es.map(e=>`<th>${e.sym} – ${e.name} <a href="#" onclick="rmCmp(${e.z});return false" style="color:var(--mut)">✕</a></th>`).join('')}</tr>`+
  rows.map(([n,k])=>`<tr><td style="color:var(--mut)">${n}</td>${es.map(e=>`<td>${k==='yr'&&e.yr==='0'?'Cổ đại':fmt(e[k])}</td>`).join('')}</tr>`).join('')+'</table>';
}
function updateT(){
  const T=curT;document.getElementById('tv').innerHTML=`<b>${T} K</b><span>${(T-273.15).toFixed(1)} °C</span>`;
  document.querySelectorAll('.el').forEach(d=>{const e=E[d.dataset.z-1],t=stAt(e),b=d.querySelector('.st');
    b.textContent=t;b.className='st '+stK(t);d.querySelector('.tb i').style.left=Math.min(100,T/60)+'%'});
  if(q.value.trim())filter()}
document.getElementById('T').oninput=function(){curT=+this.value;updateT()};
document.getElementById('t0').onclick=()=>{curT=298;document.getElementById('T').value=298;updateT()};
updateT();
let theme=matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';
function applyTheme(){document.documentElement.dataset.theme=theme;document.getElementById('th').textContent=theme==='dark'?'☀️ Sáng':'🌙 Tối'}
document.getElementById('th').onclick=()=>{theme=theme==='dark'?'light':'dark';applyTheme()};
applyTheme();
</script>
</body>
